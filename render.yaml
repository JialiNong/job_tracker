# Render Blueprint for Job Tracker Web UI
# Deploy only the Flask tracking interface.
# Daily collection + matching run on GitHub Actions and write to MongoDB Atlas.

services:
  - type: web
    name: job-tracker-web
    env: python
    region: oregon  # Choose region closest to you
    plan: free
    
    # Build command - install only web dependencies (no Playwright/lingua),
    # then the project itself (editable, see pyproject.toml)
    buildCommand: pip install -r requirements-web.txt && pip install --no-deps -e .

    # Start command - use gunicorn for production
    # Bind to $PORT (Render sets this automatically)
    # Exactly ONE worker: Log Job / Run AI progress and locks live in process
    # memory (src/web/chrome_tasks.py). Scale with --threads, never --workers.
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 60 web.web_app:app
    
    # Health check endpoint
    healthCheckPath: /health
    
    # Environment variables
    envVars:
      # Authentication (set these in Render dashboard - keep secret!)
      - key: TRACKER_USERNAME
        sync: false  # Secret - manually set in dashboard
      
      - key: TRACKER_PASSWORD_HASH
        sync: false  # Secret - generate with scripts/tools/generate_password_hash.py
      
      # Database connection (MongoDB Atlas)
      - key: MONGO_URI
        sync: false  # Secret - get from MongoDB Atlas dashboard
      
      # Flask secret key for sessions (auto-generated)
      - key: FLASK_SECRET_KEY
        generateValue: true
      
      # AI/Matching settings (optional - only needed if using manual job logging via web)
      - key: OPENAI_API_KEY
        sync: false  # Secret - optional, only if logging jobs via web UI
      
      - key: AI_MODEL
        value: gpt-4.1-mini
      
      - key: MATCH_THRESHOLD
        value: "7.0"
      
      # Bearer token for POST /api/agent/jobs (Claude daily job push)
      - key: AGENT_API_TOKEN
        sync: false  # Secret - generate with: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
      
      # Render environment indicator (used to enable ProxyFix)
      - key: RENDER
        value: "true"
